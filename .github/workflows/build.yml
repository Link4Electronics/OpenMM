name: build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libfreetype-dev \
          libavformat-dev libavcodec-dev libswscale-dev libavutil-dev

    - name: Set up SDL
      uses: libsdl-org/setup-sdl@main
      with:
        add-to-environment: true
        build-type: Release
        install-linux-dependencies: true
        cmake-generator: Ninja
        version: 3-latest

    - name: Format Check
      run: python3 tools/format.py --dry

    - name: ASM Check
      run: python3 tools/asm.py

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Generate Summary
      run: python3 tools/asm.py >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4.6.2
      with:
        name: OpenMM
        path: game/OpenMM
        if-no-files-found: error

    - name: Update Release
      if: github.repository_owner == '0x1F9F1' && github.ref == 'refs/heads/master'
      run: |
        mkdir -p artifacts
        cp game/OpenMM artifacts/
        cd artifacts && tar czf OpenMM.tar.gz OpenMM
        gh release upload "build" "artifacts/OpenMM.tar.gz" --clobber
        git push --force origin HEAD:refs/tags/build
